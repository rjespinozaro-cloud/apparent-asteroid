<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="JOANIX" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .azul { animation: entraAzul .75s cubic-bezier(.2,.9,.3,1.15) both; }
      .roja { animation: entraRoja .75s cubic-bezier(.2,.9,.3,1.15) .15s both; }
      .pop { transform-box: fill-box; transform-origin: center; animation: pop .55s ease-out .85s both; }
      .brillo { animation: brillo .9s ease-in-out 1.5s both; }
      @keyframes entraAzul { 0% { transform: translate(90px,-90px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translate(0,0); opacity: 1; } }
      @keyframes entraRoja { 0% { transform: translate(-90px,-90px); opacity: 0; } 50% { opacity: 1; } 100% { transform: translate(0,0); opacity: 1; } }
      @keyframes pop { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }
      @keyframes brillo { 0% { transform: translateX(-70px); } 100% { transform: translateX(130px); } }
      @media (prefers-reduced-motion: reduce) { .azul, .roja, .pop, .brillo { animation: none; } }
    </style>
    <g id="sw">
      <path d="M0 -66 L11 -50 V16 H-11 V-50 Z"/>
      <path d="M-26 16 H26 V29 H-26 Z"/>
      <rect x="-6.5" y="29" width="13" height="20"/>
      <circle cx="0" cy="56" r="10"/>
    </g>
    <g id="escudoBase">
      <path d="M0 0 H80 V52 C80 78 62 92 40 100 C18 92 0 78 0 52 Z" fill="#3B82F6"/>
      <path d="M53 22 V52 A16 16 0 0 1 37 68 H26 M31 28 H53" fill="none" stroke="#FFFFFF" stroke-width="12"/>
    </g>
    <clipPath id="clipEscudo"><path d="M0 0 H80 V52 C80 78 62 92 40 100 C18 92 0 78 0 52 Z"/></clipPath>
    <mask id="cut" maskUnits="userSpaceOnUse" x="-90" y="-90" width="180" height="180">
      <rect x="-90" y="-90" width="180" height="180" fill="#fff"/>
      <use href="#sw" xlink:href="#sw" fill="#000" stroke="#000" stroke-width="10" stroke-linejoin="round" transform="rotate(-40)"/>
    </mask>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E1065"/><stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <radialGradient id="luz" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#C084FC" stop-opacity=".5"/><stop offset="1" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <clipPath id="recorte"><rect width="512" height="512" rx="112"/></clipPath>
  <g clip-path="url(#recorte)">
    <rect width="512" height="512" fill="url(#fondo)"/>
    <path d="M-512 512 L0 0 M-486 512 L26 0 M-460 512 L52 0 M-434 512 L78 0 M-408 512 L104 0 M-382 512 L130 0 M-356 512 L156 0 M-330 512 L182 0 M-304 512 L208 0 M-278 512 L234 0 M-252 512 L260 0 M-226 512 L286 0 M-200 512 L312 0 M-174 512 L338 0 M-148 512 L364 0 M-122 512 L390 0 M-96 512 L416 0 M-70 512 L442 0 M-44 512 L468 0 M-18 512 L494 0 M8 512 L520 0 M34 512 L546 0 M60 512 L572 0 M86 512 L598 0 M112 512 L624 0 M138 512 L650 0 M164 512 L676 0 M190 512 L702 0 M216 512 L728 0 M242 512 L754 0 M268 512 L780 0 M294 512 L806 0 M320 512 L832 0 M346 512 L858 0 M372 512 L884 0 M398 512 L910 0 M424 512 L936 0 M450 512 L962 0 M476 512 L988 0 M502 512 L1014 0" stroke="#fff" stroke-opacity=".07" stroke-width="3" fill="none"/>
    <rect width="512" height="512" fill="url(#luz)"/>
  </g>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#C084FC" stroke-opacity=".45" stroke-width="2"/>
  <g transform="translate(256,262) scale(3)">
      <g class="azul"><g mask="url(#cut)"><use href="#sw" xlink:href="#sw" fill="#3B82F6" transform="rotate(40)"/></g></g>
      <g class="roja"><use href="#sw" xlink:href="#sw" fill="#FF1A1A" transform="rotate(-40)"/></g>
    </g>
  <g transform="translate(202,186) scale(1.35)">
    <g class="pop">
      <path d="M0 0 H80 V52 C80 78 62 92 40 100 C18 92 0 78 0 52 Z" fill="#2E1065" stroke="#2E1065" stroke-width="9" stroke-linejoin="round"/>
      <use href="#escudoBase" xlink:href="#escudoBase"/>
      <g clip-path="url(#clipEscudo)"><g class="brillo"><rect x="0" y="-10" width="26" height="120" fill="#fff" opacity=".35" transform="skewX(-20)"/></g></g>
    </g>
  </g>
</svg>